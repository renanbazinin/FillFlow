<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FillFlow — Fill &amp; sign PDFs in your browser</title>
  <meta name="description"
    content="Fill out PDF forms, add text, checkmarks and signatures right in your browser. Free, private — your files never leave your device." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="application-name" content="FillFlow" />
  <meta name="apple-mobile-web-app-title" content="FillFlow" />
  <meta name="color-scheme" content="light dark" />
  <!-- Canvas colors from src/styles/index.css; App keeps these in sync with the chosen theme. -->
  <meta name="theme-color" content="#eceef2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0f15" media="(prefers-color-scheme: dark)" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://renanbazinin.github.io/FillFlow/" />
  <meta property="og:title" content="FillFlow — Fill & sign PDFs in your browser" />
  <meta property="og:description"
    content="Fill out PDF forms, add text, checkmarks and signatures right in your browser. Free, private, no signup." />
  <meta property="og:image" content="https://renanbazinin.github.io/FillFlow/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="FillFlow — Fill &amp; sign any PDF, right in your browser." />
  <meta property="og:site_name" content="FillFlow" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://renanbazinin.github.io/FillFlow/" />
  <meta property="twitter:title" content="FillFlow — Fill & sign PDFs in your browser" />
  <meta property="twitter:description"
    content="Fill out PDF forms, add text, checkmarks and signatures right in your browser. Free, private, no signup." />
  <meta property="twitter:image" content="https://renanbazinin.github.io/FillFlow/og-image.png" />

  <!-- Apply the saved theme before first paint to avoid a flash. Keep in sync with src/lib/theme.ts -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('fillflow:theme') || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
  <!-- Set the interface language and direction before first paint, so a right-to-left page doesn't
       flash left-to-right: the language picked on this device, else the first of the browser's
       languages the interface comes in, else English. Keep in sync with src/i18n/locale.ts -->
  <script>
    (function () {
      var locale = null;
      try {
        var saved = localStorage.getItem('fillflow:locale');
        if (saved === 'en' || saved === 'he') locale = saved;
      } catch (e) { /* storage unavailable */ }
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
      for (var i = 0; !locale && i < langs.length; i++) {
        var base = String(langs[i]).toLowerCase().split(/[-_]/)[0];
        if (base === 'iw') base = 'he';
        if (base === 'en' || base === 'he') locale = base;
      }
      locale = locale || 'en';
      document.documentElement.lang = locale;
      document.documentElement.dir = locale === 'he' ? 'rtl' : 'ltr';
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
